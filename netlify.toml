# Configuración de despliegue en Netlify
#
# Vercel detecta Next.js solo y no necesita archivo. Netlify sí:
# el runtime de Next.js es un plugin que hay que declarar, y conviene
# fijar la versión de Node para que la compilación sea reproducible.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runtime de Next.js. Netlify lo instala solo al detectar el framework,
# pero declararlo evita sorpresas si cambian sus valores por defecto.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Caché de recursos inmutables ──
# Los videos y las tipografías nunca cambian sin cambiar de nombre, así
# que se pueden cachear un año. Esto importa más de lo que parece: el
# ancho de banda del plan gratuito son 100 GB al mes y un visitante que
# recorre el feed completo descarga cerca de 128 MB. Sin caché, cada
# visita repetida vuelve a pagar ese costo.

[[headers]]
  for = "/demo/reels/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/marca/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cabeceras de seguridad ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
