# Configuración de despliegue en Netlify
#
# Vercel detecta Next.js solo y no necesita archivo. Netlify sí:
# el runtime de Next.js es un plugin que hay que declarar, y conviene
# fijar la versión de Node para que la compilación sea reproducible.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # De dónde salen los archivos pesados: los reels completos y el video
  # del hero. Las imágenes NO pasan por aquí, viven en el repositorio.
  #
  # Va en el archivo y no en el panel a propósito: es una URL pública
  # que de todos modos termina en el bundle del navegador, así que no
  # gana nada por estar oculta y sí gana por quedar versionada. Al ser
  # NEXT_PUBLIC_ se incrusta en tiempo de compilación, no de ejecución.
  NEXT_PUBLIC_MEDIA_BASE = "https://pub-af9b91193f87401e8189e8e88ccc9f19.r2.dev"

# El runtime de Next.js lo instala Netlify automáticamente al detectar
# el framework, y así empareja su versión con la de Next. Declararlo a
# mano aquí, teniéndolo además en package.json, provoca conflictos.

# ── Caché de recursos inmutables ──
# Los videos y las tipografías nunca cambian sin cambiar de nombre, así
# que se pueden cachear un año. Esto importa más de lo que parece: el
# ancho de banda del plan gratuito son 100 GB al mes y un visitante que
# recorre el feed completo descarga cerca de 128 MB. Sin caché, cada
# visita repetida vuelve a pagar ese costo.

[[headers]]
  for = "/demo/reels/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/marca/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cabeceras de seguridad ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
